<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issam Abdelhak | Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Issam Abdelhak, a full-stack web developer and Digital Development student at OFPPT in Morocco. React, Laravel, PHP, JavaScript."
    />
    <meta name="author" content="Issam Abdelhak" />

    <!-- How the link looks when shared on LinkedIn, WhatsApp, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Issam Abdelhak | Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Full-stack web developer: React, Laravel, PHP. See my projects and get in touch."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before React loads, so the page doesn't flash -->
    <script>
      try {
        const saved = localStorage.getItem('theme')
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
